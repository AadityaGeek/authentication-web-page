<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | AadiAuth</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <div class="brand"><i class="fas fa-shield-alt"></i> AadiAuth</div>
            <div class="nav-links">
                <span id="user-name"><i class="fas fa-user"></i> <span>Loading...</span></span>
                <button id="sign-out-btn">
                    <div class="loading-spinner"></div>
                    <i class="fas fa-sign-out-alt"></i> <span>Sign Out</span>
                </button>
            </div>
        </nav>
    </header>

    <div class="container">
        <div class="dashboard-box">
            <h2><i class="fas fa-tachometer-alt"></i> Welcome to Your AadiAuth Dashboard</h2>
            <p><i class="fas fa-check-circle"></i> You have successfully logged in!</p>
            <div id="user-details">
                <!-- User details will be displayed here -->
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; <span id="current-year"></span> AadiAuth by Aaditya. All rights reserved.</p>
    </footer>

    <!-- Add this script right before the closing body tag in all HTML files -->
    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="script.js"></script>
    <script>
        // Get the sign-out button
        const signOutBtn = document.getElementById('sign-out-btn');

        // Check if user is logged in
        auth.onAuthStateChanged(user => {
            if (user) {
                // User is logged in
                document.getElementById('user-name').textContent = user.displayName || user.email;
                
                // Update user details section
                const userDetails = document.getElementById('user-details');
                userDetails.innerHTML = `
                    <p><i class="fas fa-envelope"></i> <strong>Email:</strong> ${user.email}</p>
                    <p><i class="fas fa-user"></i> <strong>Name:</strong> ${user.displayName || 'Not set'}</p>
                    <p><i class="fas fa-calendar-alt"></i> <strong>Account created:</strong> ${new Date(user.metadata.creationTime).toLocaleString()}</p>
                `;
            } else {
                // User is not logged in, redirect to sign in page
                window.location.href = 'signin.html';
            }
        });
        
        // Add click event listener to sign-out button
        signOutBtn.addEventListener('click', () => {
            // Add loading state
            signOutBtn.classList.add('loading');
            signOutBtn.disabled = true;

            // Perform sign out
            auth.signOut()
                .then(() => {
                    // Redirect to sign in page after successful sign out
                    window.location.href = 'signin.html';
                })
                .catch((error) => {
                    console.error('Sign out error:', error);
                    // Remove loading state if there's an error
                    signOutBtn.classList.remove('loading');
                    signOutBtn.disabled = false;
                });
        });
    </script>
</body>
</html>
